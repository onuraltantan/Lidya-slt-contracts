[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = true
gas_reports = ["*"]
auto_detect_solc = false

# Strict warnings as errors during dev (CI overrides this)
deny = "never"

[profile.default.fuzz]
runs = 1000
max_test_rejects = 65536

[profile.default.invariant]
runs = 256
depth = 32
fail_on_revert = true

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 1024, depth = 64 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
multiline_func_header = "params_first"
quote_style = "double"

[rpc_endpoints]
avalanche = "${AVALANCHE_RPC_URL}"
fuji = "${FUJI_RPC_URL}"

[etherscan]
avalanche = { key = "${SNOWTRACE_API_KEY}", chain = 43114 }
fuji = { key = "${SNOWTRACE_API_KEY}", chain = 43113 }
